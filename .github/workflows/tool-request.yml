name: Tool Request

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: kinotch-tool-bridge-v1
  cancel-in-progress: false

jobs:
  # Existing private-only v1 transport remains separate and unchanged in scope.
  private_bridge:
    if: >-
      ${{ github.event.repository.private == true &&
          github.event.repository.full_name == 'kinoko34077/testapp' &&
          github.event.issue.user.id == 79015263 &&
          github.event.issue.author_association == 'OWNER' &&
          startsWith(github.event.issue.title, '[TOOL REQUEST] ') }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Jev Audit
        run: >-
          python -m pip install
          "git+https://github.com/kinoko34077/jev-audit.git@e05481517eb05c39112b092d03fd883951f2b97f"
      - name: Execute bounded bridge request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPRESSION_API_TOKEN: ${{ secrets.COMPRESSION_API_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/run-request.mjs "$GITHUB_EVENT_PATH"

  # Public requests are already visible at issue creation. Fail closed BEFORE
  # loading any provider secrets. Caller-side prepublication check is mandatory.
  public_admission:
    if: >-
      ${{ github.event.repository.private == false &&
          github.event.repository.full_name == 'kinoko34077/testapp' &&
          github.event.issue.user.id == 79015263 &&
          github.event.issue.author_association == 'OWNER' &&
          startsWith(github.event.issue.title, '[TOOL REQUEST] ') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
      - name: Validate public-only request without secrets
        run: node scripts/check-public-request.mjs "$GITHUB_EVENT_PATH"

  public_compress:
    needs: public_admission
    if: >-
      ${{ needs.public_admission.result == 'success' &&
          github.event.repository.private == false &&
          github.event.repository.full_name == 'kinoko34077/testapp' &&
          github.event.issue.user.id == 79015263 &&
          github.event.issue.author_association == 'OWNER' &&
          startsWith(github.event.issue.title, '[TOOL REQUEST] ') }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
      - name: Execute admitted public semantic compression only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPRESSION_API_TOKEN: ${{ secrets.COMPRESSION_API_TOKEN }}
        run: node scripts/run-request.mjs "$GITHUB_EVENT_PATH"
