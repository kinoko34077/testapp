name: Tool Request

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: kinotch-tool-bridge-v1
  cancel-in-progress: false

jobs:
  bridge:
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Jev Audit
        run: >-
          python -m pip install
          "git+https://github.com/kinoko34077/jev-audit.git@b1462ac2d5e9f1e8e8a12db60ca2a15931cb3eaa"

      - name: Execute bounded bridge request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPRESSION_API_TOKEN: ${{ secrets.COMPRESSION_API_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/run-request.mjs "$GITHUB_EVENT_PATH"
