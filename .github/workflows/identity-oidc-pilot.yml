name: KiNoTch Identity OIDC issuer-only pilot (manual)

# New GitHub OIDC job-level permission: HUMAN SECURITY GATE before merge or run.
# Does not reach any external Worker, secret, API or privileged operation.
on:
  workflow_dispatch:

permissions: {}

jobs:
  pilot:
    if: >-
      github.repository == 'kinoko34077/testapp' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'kinoko34077'
    permissions:
      id-token: write
    uses: kinoko34077/devflow/.github/workflows/identity-oidc-recipient-pilot.yml@ffb2f72eafe5275fb03a782511f4522158d07ef1
